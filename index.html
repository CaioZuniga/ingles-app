<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1014" />
    <script>
      // Aplica o tema salvo antes do primeiro desenho (evita piscar claro/escuro).
      try {
        var t = localStorage.getItem('fluent-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <meta name="description" content="Inglês personalizado: vocabulário, gramática, listening, writing e speaking com correção por IA." />
    <link rel="icon" href="/ingles-app/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/ingles-app/icon.svg" type="image/svg+xml" />
    <!-- iPhone: ícone na tela de início e abertura em tela cheia. -->
    <link rel="apple-touch-icon" href="/ingles-app/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fluent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Fluent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
